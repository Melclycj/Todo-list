# Development override — adds live-reload for both the API and frontend.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# NOT for production or VPS: volume mounts replace built images with local
# source directories, bypassing the Dockerfile build at runtime.

services:
  api:
    # Include migrations so the dev DB is always up-to-date on startup
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"   # expose API directly for debugging/curl in dev
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: builder   # Node.js stage only — Nginx not needed in dev
    # Run npm install before dev server to sync node_modules with package.json.
    # The named volume persists across rebuilds, so without this sync step,
    # newly added packages would be missing until a manual volume wipe.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    # Port 8080:80 is inherited from docker-compose.yml (nginx/prod mapping).
    # It binds to container port 80, which has nothing listening in the builder
    # stage — connecting to localhost:8080 will be refused in dev. Use 5173.
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Named volume preserves node_modules across container restarts,
      # preventing the host mount from overwriting them with an empty directory.
      # Unlike anonymous volumes, this survives `docker compose down` (without -v)
      # and can be selectively removed: `docker volume rm todo-list_frontend_node_modules`
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true   # needed for file-watch on Windows/WSL2
      - VITE_POLL=true

volumes:
  frontend_node_modules:
